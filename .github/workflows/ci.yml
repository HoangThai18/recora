name: CI

on:
  push:
    branches: ['**']
    tags: ['recora-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ffmpeg:
    name: FFmpeg tối giản
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      artifact: ${{ steps.name.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4

      - name: Artifact name
        id: name
        shell: bash
        run: echo "artifact=ffmpeg-${{ hashFiles('tools/ffmpeg/**') }}" >> "$GITHUB_OUTPUT"

      # actions/cache is scoped per branch; an artifact of an earlier run with the same script hash saves the
      # 12-minute build on every new branch. Only artifacts built from this repository's own branches count: the repo
      # is public, and a fork's pull request could otherwise upload a tampered ffmpeg.exe under the same name.
      # A release (tag) always builds FFmpeg from source in its own run: what ships is never an artifact of another run.
      - name: Reuse FFmpeg from an earlier run
        id: reuse
        if: github.ref_type != 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.name.outputs.artifact }}
        run: |
          id=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=$NAME&per_page=100" \
            --jq '[.artifacts[]
                   | select(.expired | not)
                   | select(.workflow_run.head_repository_id == .workflow_run.repository_id)
                   | select(.workflow_run.head_branch == "main" or (.workflow_run.head_branch | test("^(phase|task)/")))
                  ][0].id // empty')
          if [ -n "$id" ]; then
            gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > ffmpeg.zip
            mkdir -p artifacts/ffmpeg
            unzip -q ffmpeg.zip -d artifacts/ffmpeg
            rm ffmpeg.zip
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "Reused artifact $id"
          fi

      - name: Cache FFmpeg build
        if: github.ref_type != 'tag' && steps.reuse.outputs.hit != 'true'
        id: cache
        uses: actions/cache@v4
        with:
          path: artifacts/ffmpeg
          key: ffmpeg-${{ hashFiles('tools/ffmpeg/**') }}

      - name: Set up MSYS2 UCRT64
        if: steps.reuse.outputs.hit != 'true' && steps.cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            diffutils
            tar
            xz
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-ffnvcodec-headers
            mingw-w64-ucrt-x86_64-amf-headers
            mingw-w64-ucrt-x86_64-libvpl
            mingw-w64-ucrt-x86_64-libx264

      - name: Build FFmpeg
        if: steps.reuse.outputs.hit != 'true' && steps.cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash tools/ffmpeg/build.sh

      - name: Verify FFmpeg
        shell: bash
        run: bash tools/ffmpeg/verify.sh artifacts/ffmpeg

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: artifacts/ffmpeg
          retention-days: 30

  app:
    name: App Windows (build, test, ghi thử, đóng gói)
    needs: ffmpeg
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Recora.sln -c Release

      - name: Unit tests
        run: dotnet test tests/Recora.Core.Tests -c Release --no-build

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.ffmpeg.outputs.artifact }}
          path: artifacts/ffmpeg

      - name: Self-test (ghi màn hình thật 3 giây)
        shell: pwsh
        run: tools/ci/selftest.ps1

      - name: Bộ ghi của app (tạm dừng, sập giữa chừng rồi cứu, lưu cài đặt)
        shell: pwsh
        run: tools/ci/recorder-checks.ps1

      - name: Chụp giao diện
        shell: pwsh
        run: tools/ci/ui-screenshots.ps1

      - name: Các chế độ P2 (vùng, chỉ âm thanh, chụp ảnh)
        shell: pwsh
        run: tools/ci/modes-checks.ps1

      - name: Lưu khoảnh khắc (vòng đệm, lưu hai lần)
        shell: pwsh
        run: tools/ci/replay-checks.ps1

      - name: Cắt video (độ dài, ảnh xem trước, bản cắt)
        shell: pwsh
        run: tools/ci/trim-checks.ps1

      - name: Cửa sổ Recora không lọt vào video của chính nó
        shell: pwsh
        run: tools/ci/exclusion-check.ps1

      - name: Đóng gói zip portable
        id: package
        shell: pwsh
        run: tools/ci/package.ps1

      - name: Upload selftest and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-and-screenshots
          path: |
            artifacts/selftest
            artifacts/screenshots
          retention-days: 14

      - name: Bộ cài (cài, chạy, gỡ im lặng)
        id: installer
        shell: pwsh
        run: tools/ci/installer.ps1

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: recora-setup
          path: ${{ steps.installer.outputs.setup }}
          retention-days: 30

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: recora-portable
          path: ${{ steps.package.outputs.zip }}
          retention-days: 30

  release:
    name: Phát hành lên GitHub Releases
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'recora-')
    needs: [ffmpeg, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Kiểm phiên bản, gom file, tạo Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          FFMPEG: ${{ needs.ffmpeg.outputs.artifact }}
        run: |
          set -euo pipefail
          version="${TAG#recora-}"
          props=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          [ "$version" = "$props" ] || { echo "tag $TAG does not match Directory.Build.props $props"; exit 1; }
          notes="docs/release-notes/$version.md"
          [ -f "$notes" ] || { echo "missing $notes"; exit 1; }

          mkdir -p upload
          cp dist/recora-portable/recora-$version-windows-x64-portable.zip upload/
          cp dist/recora-setup/recora-$version-windows-x64-setup.exe upload/
          # GPL: the exact FFmpeg and x264 sources of the ffmpeg.exe inside these files.
          tar -C "dist/$FFMPEG" -czf upload/recora-$version-ffmpeg-sources.tar.gz sources BUILDINFO.txt
          (cd upload && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)

          {
            cat "$notes"
            echo
            echo "---"
            echo
            echo "Recora miễn phí, mã nguồn mở theo giấy phép MIT. ffmpeg.exe đi kèm theo GPL v2 trở lên; mã nguồn đúng bản dựng nằm trong file recora-$version-ffmpeg-sources.tar.gz. Bản cài chưa ký số nên Windows SmartScreen có thể cảnh báo lần đầu: bấm \"More info\" rồi \"Run anyway\". Đối chiếu SHA-256 trong SHA256SUMS.txt để chắc file nguyên vẹn."
          } > body.md

          gh release create "$TAG" upload/* --title "Recora $version" --notes-file body.md

